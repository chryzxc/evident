# Copy to .github/workflows/evident.yml
name: Evident
on: [pull_request]
jobs:
  scan:
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npx evident scan --ci --changed-only --base origin/${{ github.base_ref }} --fail-on high --format terminal,sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: { sarif_file: .evident/reports }
